name: Build Linux

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        run: |
          set +e
          npm run tauri build -- --bundles deb,rpm 2>&1 | tee /tmp/build.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" -ne 0 ]; then
            TAIL=$(tail -n 60 /tmp/build.log | sed -e 's/%/%25/g' -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')
            echo "::error title=tauri_build_failed::$TAIL"
          fi
          exit "$CODE"

      - name: Show bundle output
        if: always()
        run: |
          set +e
          echo "== full listing of src-tauri/target/release/bundle =="
          ls -laR src-tauri/target/release/bundle || echo "NO BUNDLE DIR"
          BUNDLE_DIRS=$(find src-tauri/target -type d -name bundle 2>/dev/null | tr '\n' ' ')
          PKGS=$(find src-tauri/target -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) 2>/dev/null | tr '\n' ' ')
          TARGET_DIRS=$(find src-tauri/target -maxdepth 2 -type d -name release 2>/dev/null | tr '\n' ' ')
          echo "::warning title=bundle_dirs::${BUNDLE_DIRS:-NONE}"
          echo "::warning title=linux_packages::${PKGS:-NONE}"
          echo "::warning title=release_dirs::${TARGET_DIRS:-NONE}"

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: memo-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: ignore

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: memo-linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: ignore

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          generate_release_notes: true
